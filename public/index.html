<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>财务支出明细看板</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f0f2f5; color: #333; }
.header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); color: white; padding: 24px 24px; text-align: center; position: relative; }
.header h1 { font-size: 26px; margin-bottom: 4px; }
.header p { font-size: 13px; opacity: 0.8; }
.header-actions { position: absolute; top: 14px; right: 20px; display: flex; gap: 6px; align-items: center; }
.sync-status { display: flex; align-items: center; gap: 5px; font-size: 11px; padding: 4px 10px; border-radius: 12px; background: rgba(255,255,255,0.12); cursor: pointer; }
.sync-status .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.sync-status .dot.green { background: #52c41a; }
.sync-status .dot.yellow { background: #faad14; animation: pulse 1.2s infinite; }
.sync-status .dot.red { background: #ff4d4f; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
.month-selector { display: flex; gap: 8px; justify-content: center; padding: 14px 20px 8px; flex-wrap: wrap; }
.month-btn { padding: 7px 22px; border: 1px solid #d9d9d9; border-radius: 20px; background: white; cursor: pointer; font-size: 13px; font-family: inherit; transition: 0.15s; font-weight: 500; }
.month-btn:hover { border-color: #1890ff; color: #1890ff; }
.month-btn.active { background: #1890ff; color: white; border-color: #1890ff; }
.container { max-width: 1200px; margin: 0 auto; padding: 16px 20px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
.card { background: white; border-radius: 10px; padding: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); text-align: center; }
.card .label { font-size: 11px; color: #888; margin-bottom: 3px; }
.card .value { font-size: 20px; font-weight: 700; }
.card .sub { font-size: 10px; color: #999; margin-top: 3px; }
.card.blue .value { color: #1890ff; }
.card.red .value { color: #f5222d; }
.card.green .value { color: #52c41a; }
.card.orange .value { color: #fa8c16; }
.card.purple .value { color: #722ed1; }
.card.teal .value { color: #13c2c2; }
.charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 16px; }
.chart-box { background: white; border-radius: 10px; padding: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.chart-box h3 { font-size: 13px; margin-bottom: 8px; color: #444; }
.chart-box canvas { max-height: 240px; max-width: 100%; }
.chart-full { background: white; border-radius: 10px; padding: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 16px; }
.chart-full h3 { font-size: 13px; margin-bottom: 8px; color: #444; }
.chart-full canvas { max-height: 200px; max-width: 100%; }
.section { background: white; border-radius: 10px; padding: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 14px; }
.section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 6px; }
.section-header h3 { font-size: 14px; color: #444; display: flex; align-items: center; gap: 6px; }
.section-header .badge { font-size: 10px; background: #1890ff; color: white; padding: 2px 7px; border-radius: 10px; font-weight: 400; }
.section-header .actions { display: flex; gap: 6px; align-items: center; }
.section-note { font-size: 11px; color: #999; margin-top: 6px; }
table { width: 100%; border-collapse: collapse; font-size: 11px; }
thead th { background: #fafafa; padding: 7px 5px; text-align: center; font-weight: 600; color: #555; border-bottom: 2px solid #e8e8e8; white-space: nowrap; }
tbody td { padding: 3px; text-align: center; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
tbody tr:hover { background: #f5f8ff; }
.text-left { text-align: left; }
.editable { width: 100%; border: none; background: transparent; text-align: center; font-size: 11px; font-family: inherit; padding: 3px 2px; border-radius: 3px; outline: none; transition: 0.15s; }
.editable:hover { background: #f0f4ff; }
.editable:focus { background: #e6f0ff; box-shadow: 0 0 0 2px rgba(24,144,255,0.3); }
.editable-note { text-align: left; }
.editable.calc { color: #666; font-weight: 500; background: #fafafa; cursor: default; }
td.calc { color: #666; font-weight: 500; background: #fafafa; }
.weekly-utils { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 6px; }
.weekly-utils .wu-item { background: #fafafa; border-radius: 8px; padding: 10px 14px; text-align: center; min-width: 110px; flex: 1; }
.weekly-utils .wu-item .wu-label { font-size: 11px; color: #888; margin-bottom: 3px; }
.weekly-utils .wu-item .wu-input { width: 90px; padding: 5px 8px; border: 1px solid #d9d9d9; border-radius: 5px; font-size: 13px; text-align: center; outline: none; transition: 0.15s; }
.weekly-utils .wu-item .wu-input:focus { border-color: #1890ff; box-shadow: 0 0 0 2px rgba(24,144,255,0.2); }
.weekly-utils .wu-item .wu-total { font-size: 15px; font-weight: 700; color: #13c2c2; padding: 5px 0; }
.btn { padding: 5px 12px; border: none; border-radius: 5px; font-size: 11px; cursor: pointer; transition: 0.15s; font-family: inherit; display: inline-flex; align-items: center; gap: 3px; }
.btn-primary { background: #1890ff; color: white; }
.btn-primary:hover { background: #40a9ff; }
.btn-success { background: #52c41a; color: white; }
.btn-success:hover { background: #73d13d; }
.btn-outline { background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.3); }
.btn-outline:hover { border-color: rgba(255,255,255,0.6); }
.btn-sm { padding: 3px 8px; font-size: 10px; }
.balance-row { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.balance-edit { display: flex; align-items: center; gap: 5px; background: white; padding: 4px 10px; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.balance-edit label { font-size: 11px; color: #666; white-space: nowrap; }
.balance-edit input { width: 72px; padding: 3px 6px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 12px; text-align: center; outline: none; }
.balance-edit input:focus { border-color: #1890ff; box-shadow: 0 0 0 2px rgba(24,144,255,0.2); }
.del-btn { opacity: 0.3; cursor: pointer; font-size: 13px; transition: 0.15s; background: none; border: none; padding: 2px 5px; }
.del-btn:hover { opacity: 1; color: #ff4d4f; }
tr:hover .del-btn { opacity: 0.6; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 8px 20px; border-radius: 6px; font-size: 12px; opacity: 0; transition: 0.3s; pointer-events: none; z-index: 999; }
.toast.show { opacity: 1; }
@media (max-width: 768px) {
  .charts-row { grid-template-columns: 1fr; }
  .cards { grid-template-columns: repeat(3, 1fr); }
  .header-actions { position: static; margin-top: 10px; justify-content: center; flex-wrap: wrap; }
  .section-header { flex-direction: column; align-items: flex-start; }
  .weekly-utils { flex-direction: column; }
}
@media (max-width: 480px) {
  .cards { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>

<div class="header">
  <h1>财务支出明细看板</h1>
  <p id="headerDateRange">2026年6月15日 — 2026年7月4日</p>
  <div class="header-actions">
    <span class="sync-status" id="syncStatus" onclick="manualSync()" title="点击手动同步">
      <span class="dot yellow" id="syncDot"></span>
      <span id="syncText">连接中...</span>
    </span>
    <button class="btn btn-outline btn-sm" onclick="resetData()">重置</button>
    <button class="btn btn-outline btn-sm" onclick="exportCSV()">导出</button>
  </div>
</div>

<div class="month-selector" id="monthSelector"></div>

<div class="container">

<div class="cards" id="cardsContainer"></div>

<div class="balance-row">
  <div class="balance-edit">
    <label id="balanceLabel">6月初始余额</label>
    <input type="number" id="initBalanceInput" step="0.01">
    <button class="btn btn-primary btn-sm" onclick="updateFromBalanceChange()">更新</button>
  </div>
</div>

<div class="charts-row">
  <div class="chart-box"><h3>分类支出占比（<span id="pieChartMonth">6月</span>）</h3><canvas id="pieChart"></canvas></div>
  <div class="chart-box"><h3>每日支出趋势（<span id="barChartMonth">6月</span>）</h3><canvas id="barChart"></canvas></div>
</div>

<div class="chart-full"><h3>余额变化趋势（<span id="lineChartMonth">6月</span>）</h3><canvas id="lineChart"></canvas></div>

<div class="section">
  <div class="section-header">
    <h3>💧 水电支出（每周结算）<span class="badge">按周填写</span></h3>
  </div>
  <p style="font-size:11px;color:#999;margin-bottom:8px;">水电费每周结算一次，在各周输入框中填写金额</p>
  <div class="weekly-utils" id="weeklyUtilsContainer"></div>
</div>

<div class="section">
  <div class="section-header"><h3>📆 月度汇总 <span class="badge">自动计算</span></h3></div>
  <div style="overflow-x:auto">
    <table><thead><tr><th>月份</th><th>天数</th><th>月初余额</th><th>饮食</th><th>交通</th><th>水电</th><th>其他</th><th>月合计</th><th>日均</th></tr></thead>
      <tbody id="monthlyBody"></tbody>
    </table>
  </div>
</div>

<div class="section">
  <div class="section-header"><h3>周度汇总 <span class="badge">自动计算</span></h3></div>
  <div style="overflow-x:auto">
    <table><thead><tr><th>周次</th><th>饮食</th><th>交通</th><th>水电</th><th>其他</th><th>周合计</th></tr></thead>
      <tbody id="weeklyBody"></tbody>
    </table>
  </div>
</div>

<div class="section" id="dailySection">
  <div class="section-header">
    <h3>每日明细 <span class="badge" id="daysCount">0 天</span></h3>
    <div class="actions">
      <button class="btn btn-primary btn-sm" onclick="addRow()">+ 新增行</button>
    </div>
  </div>
  <div style="overflow-x:auto">
    <table>
      <thead><tr>
        <th style="width:24px"></th><th>日期</th><th>周</th>
        <th>饮食-W</th><th>饮食-H</th><th>饮食小计</th>
        <th>交通</th><th>其他</th><th>日合计</th><th>余额</th><th>备注</th>
      </tr></thead>
      <tbody id="dailyBody"></tbody>
    </table>
  </div>
  <div class="section-note">水电已改为每周结算，请在上方「水电支出（每周结算）」区域填写</div>
</div>

</div>

<div id="toast" class="toast"></div>

<script>
// ========== CONFIG ==========
const SYNC_INTERVAL = 3000;

// ========== DATA ==========
let dailyData = [];
let weeklyUtils = { w1: 21, w2: 45, w3: 0, w4: 0 };
let monthlyBudgets = { '2026-06': 2370, '2026-07': 2370 };
let currentMonth = '2026-06';
let chartInstances = {};
let lastSavedHash = '';
let isSyncing = false;
let isLocalChange = false;

const STORAGE_KEY = 'finance_dashboard_local';
const WEEK_LABELS = ['第1周 (6/15-6/21)', '第2周 (6/22-6/28)', '第3周 (6/29-7/05)', '第4周 (7/06-7/12)'];
const WEEK_KEYS = ['w1', 'w2', 'w3', 'w4'];
const WEEK_RANGES = [
  ['2026-06-15','2026-06-21'],
  ['2026-06-22','2026-06-28'],
  ['2026-06-29','2026-07-05'],
  ['2026-07-06','2026-07-12']
];
const WEEK_NAMES = ['一','二','三','四','五','六','日'];
const CAT_COLORS = { food: '#fa8c16', transport: '#1890ff', utilities: '#13c2c2', other: '#722ed1' };

const ORIGINAL_DATA = [
  {d:"2026-06-15",w:"一",fw:34,fh:0,fs:34,t:39.2,o:0,total:73.2,rem:2296.8,note:""},
  {d:"2026-06-16",w:"二",fw:15,fh:0,fs:15,t:6,o:43,total:64,rem:2232.8,note:"零食"},
  {d:"2026-06-17",w:"三",fw:15,fh:15.5,fs:30.5,t:1,o:11.4,total:42.9,rem:2189.9,note:"零食"},
  {d:"2026-06-18",w:"四",fw:18,fh:13,fs:31,t:5,o:49,total:85,rem:2104.9,note:"AI"},
  {d:"2026-06-19",w:"五",fw:10,fh:13,fs:23,t:11,o:149.64,total:183.64,rem:1921.26,note:"游戏+话费"},
  {d:"2026-06-20",w:"六",fw:52.5,fh:52.5,fs:105,t:4,o:15.3,total:124.3,rem:1796.96,note:"日用品"},
  {d:"2026-06-21",w:"日",fw:19,fh:0,fs:19,t:6,o:61,total:107,rem:1689.96,note:"请弟弟和女"},
  {d:"2026-06-22",w:"一",fw:11.4,fh:0,fs:11.4,t:31,o:6.4,total:48.8,rem:1641.16,note:"交通模型"},
  {d:"2026-06-23",w:"二",fw:15,fh:16.68,fs:31.68,t:1,o:0,total:32.68,rem:1608.48,note:""},
  {d:"2026-06-24",w:"三",fw:15,fh:8.18,fs:23.18,t:0,o:18,total:41.18,rem:1567.3,note:"AI"},
  {d:"2026-06-25",w:"四",fw:15,fh:7.43,fs:22.43,t:0,o:6.05,total:28.48,rem:1538.82,note:"买菜"},
  {d:"2026-06-26",w:"五",fw:39.67,fh:0,fs:39.67,t:1.67,o:89,total:130.34,rem:1408.48,note:"继续"},
  {d:"2026-06-27",w:"六",fw:0,fh:6.48,fs:6.48,t:4,o:72.95,total:83.43,rem:1325.05,note:"水果+AI+奶茶"},
  {d:"2026-06-28",w:"日",fw:37,fh:37,fs:74,t:6,o:70,total:195,rem:1130.05,note:"买东西"},
  {d:"2026-06-29",w:"一",fw:0,fh:0,fs:0,t:2,o:0,total:2,rem:1128.05,note:""},
  {d:"2026-06-30",w:"二",fw:0,fh:0,fs:0,t:0,o:0,total:0,rem:1128.05,note:""},
  {d:"2026-07-01",w:"三",fw:0,fh:0,fs:0,t:0,o:0,total:0,rem:2370,note:""},
  {d:"2026-07-02",w:"四",fw:0,fh:0,fs:0,t:0,o:0,total:0,rem:2370,note:""},
  {d:"2026-07-03",w:"五",fw:0,fh:0,fs:0,t:0,o:0,total:0,rem:2370,note:""},
  {d:"2026-07-04",w:"六",fw:0,fh:0,fs:0,t:0,o:0,total:0,rem:2370,note:""}
];

// ========== HELPERS ==========
function getMonthDisplay(monthKey) {
  return parseInt(monthKey.split('-')[1]) + '月';
}

function getWeekMonth(wi) {
  return WEEK_RANGES[wi][1].slice(0, 7);
}

function getAvailableMonths() {
  const months = new Set();
  dailyData.forEach(d => months.add(d.d.slice(0, 7)));
  WEEK_KEYS.forEach((k, i) => months.add(getWeekMonth(i)));
  return Array.from(months).sort();
}

// ========== DATA HASH ==========
function computeHash() {
  const str = JSON.stringify({ d: dailyData, w: weeklyUtils, b: monthlyBudgets });
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    const c = str.charCodeAt(i);
    hash = ((hash << 5) - hash) + c;
    hash = hash & hash;
  }
  return hash.toString(36);
}

// ========== SYNC ==========
function setSyncStatus(state, text) {
  const dot = document.getElementById('syncDot');
  const txt = document.getElementById('syncText');
  dot.className = 'dot ' + state;
  txt.textContent = text;
}

async function syncToServer() {
  if (isSyncing) return;
  isSyncing = true;
  try {
    const payload = { data: { dailyData, weeklyUtils, monthlyBudgets, currentMonth } };
    const res = await fetch('/api/data', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const json = await res.json();
    if (json.success) {
      lastSavedHash = computeHash();
      setSyncStatus('green', '已同步');
    }
  } catch (e) {
    setSyncStatus('red', '未连接');
  }
  isSyncing = false;
}

async function syncFromServer() {
  try {
    const res = await fetch('/api/data');
    const json = await res.json();
    if (json.success && json.data && json.data.data) {
      const localHash = computeHash();
      if (localHash !== lastSavedHash) {
        return false;
      }
      const serverData = json.data.data;
      const serverStr = JSON.stringify({ d: serverData.dailyData, w: serverData.weeklyUtils });
      const currentStr = JSON.stringify({ d: dailyData, w: weeklyUtils });
      if (serverStr !== currentStr && !isLocalChange) {
        dailyData = serverData.dailyData;
        weeklyUtils = serverData.weeklyUtils;
        if (serverData.monthlyBudgets) monthlyBudgets = serverData.monthlyBudgets;
        render();
        setSyncStatus('green', '已同步');
        toast('检测到其他设备的更改，已自动更新');
        return true;
      }
      setSyncStatus('green', '已同步');
    }
  } catch (e) {
    setSyncStatus('red', '未连接');
  }
  return false;
}

async function manualSync() {
  setSyncStatus('yellow', '同步中...');
  await syncToServer();
  await syncFromServer();
}

function startSync() {
  loadFromServer().then(changed => {
    if (!changed) loadLocalFallback();
    render();
    syncToServer();
    setInterval(async () => {
      isLocalChange = false;
      await syncFromServer();
    }, SYNC_INTERVAL);
  });
}

async function loadFromServer() {
  try {
    const res = await fetch('/api/data');
    const json = await res.json();
    if (json.success && json.data && json.data.data) {
      const sd = json.data.data;
      if (sd.dailyData && sd.dailyData.length > 0) {
        dailyData = sd.dailyData;
        weeklyUtils = sd.weeklyUtils || { w1:21, w2:45, w3:0, w4:0 };
        monthlyBudgets = sd.monthlyBudgets || { '2026-06': 2370, '2026-07': 2370 };
        const savedMonth = localStorage.getItem(STORAGE_KEY + '_month');
					currentMonth = savedMonth || sd.currentMonth || getAvailableMonths()[0] || "2026-06";
        lastSavedHash = computeHash();
        setSyncStatus('green', '已同步');
        return true;
      }
    }
    setSyncStatus('yellow', '无服务端数据');
  } catch (e) {
    setSyncStatus('yellow', '离线模式');
  }
  return false;
}

function loadLocalFallback() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const p = JSON.parse(saved);
      dailyData = p.data || [];
      weeklyUtils = p.weeklyUtils || { w1:21, w2:45, w3:0, w4:0 };
      monthlyBudgets = p.monthlyBudgets || { '2026-06': 2370, '2026-07': 2370 };
      currentMonth = localStorage.getItem(STORAGE_KEY + '_month') || p.currentMonth || '2026-06';
      if (dailyData.length > 0) return;
    }
  } catch(e) {}
  dailyData = ORIGINAL_DATA.map(d => ({...d}));
  weeklyUtils = { w1: 21, w2: 45, w3: 0, w4: 0 };
  monthlyBudgets = { '2026-06': 2370, '2026-07': 2370 };
  currentMonth = '2026-06';
}

// ========== SAVE ==========
function saveData() {
  localStorage.setItem(STORAGE_KEY + '_month', currentMonth);
		localStorage.setItem(STORAGE_KEY, JSON.stringify({
    data: dailyData, weeklyUtils, monthlyBudgets, currentMonth
  }));
  isLocalChange = true;
  syncToServer();
}

// ========== CALCULATIONS ==========
function getWeekIndex(dateStr) {
  const d = new Date(dateStr);
  for (let i = 0; i < WEEK_RANGES.length; i++) {
    const s = new Date(WEEK_RANGES[i][0]), e = new Date(WEEK_RANGES[i][1]);
    if (d >= s && d <= e) return i;
  }
  return -1;
}

function recalc() {
  for (let i = 0; i < dailyData.length; i++) {
    const d = dailyData[i];
    d.fs = Math.round((d.fw + d.fh) * 100) / 100;
    d.total = Math.round((d.fs + d.t + d.o) * 100) / 100;
    let utilsToday = 0;
    for (let wi = 0; wi < WEEK_RANGES.length; wi++) {
      if (d.d === WEEK_RANGES[wi][1]) {
        utilsToday = parseFloat(weeklyUtils[WEEK_KEYS[wi]]) || 0;
        break;
      }
    }
    const dayExpense = Math.round((d.total + utilsToday) * 100) / 100;
    if (i === 0) {
      d.rem = Math.round(((monthlyBudgets[d.d.slice(0, 7)] || 0) - dayExpense) * 100) / 100;
    } else {
      d.rem = Math.round((dailyData[i-1].rem - dayExpense) * 100) / 100;
    }
  }
}

function getMonthStartBalance(monthKey) {
  const firstDay = dailyData.find(d => d.d.startsWith(monthKey));
  if (!firstDay) return monthlyBudgets[monthKey] || 0;
  const idx = dailyData.indexOf(firstDay);
  if (idx <= 0) return monthlyBudgets[monthKey] || 0;
  return dailyData[idx - 1].rem;
}

function getMonthSummary(monthKey) {
  const monthData = dailyData.filter(d => d.d.startsWith(monthKey));
  const monthUtilsKeys = WEEK_KEYS.filter((k, i) => getWeekMonth(i) === monthKey);
  const monthUtils = monthUtilsKeys.reduce((s, k) => s + (parseFloat(weeklyUtils[k])||0), 0);

  const dailyTotals = monthData.map(d => d.total);
  const withData = monthData.filter(d => d.total > 0);
  const totalExpense = dailyTotals.reduce((s,v) => s+v, 0) + monthUtils;
  const recordDays = withData.length;
  const dailyAvg = recordDays > 0 ? totalExpense / recordDays : 0;
  const maxDaily = withData.length > 0 ? Math.max(...withData.map(d => d.total)) : 0;
  const startBalance = getMonthStartBalance(monthKey);
  const lastDay = monthData.length > 0 ? monthData[monthData.length-1] : null;
  const curBalance = lastDay ? lastDay.rem : startBalance;
  const usageRatio = startBalance > 0 ? (totalExpense / startBalance) * 100 : 0;

  let food = 0, transport = 0, other = 0;
  monthData.forEach(d => { food += d.fs; transport += d.t; other += d.o; });
  const catTotal = food + transport + monthUtils + other;
  const cats = [
    { n: '饮食', amt: Math.round(food*100)/100, pct: catTotal > 0 ? Math.round(food/catTotal*1000)/10 : 0, color: CAT_COLORS.food },
    { n: '交通', amt: Math.round(transport*100)/100, pct: catTotal > 0 ? Math.round(transport/catTotal*1000)/10 : 0, color: CAT_COLORS.transport },
    { n: '水电', amt: Math.round(monthUtils*100)/100, pct: catTotal > 0 ? Math.round(monthUtils/catTotal*1000)/10 : 0, color: CAT_COLORS.utilities },
    { n: '其他', amt: Math.round(other*100)/100, pct: catTotal > 0 ? Math.round(other/catTotal*1000)/10 : 0, color: CAT_COLORS.other }
  ];

  return {
    totalExpense: Math.round(totalExpense*100)/100,
    dailyAvg: Math.round(dailyAvg*100)/100, recordDays,
    maxDaily: Math.round(maxDaily*100)/100,
    curBalance: Math.round(curBalance*100)/100,
    usageRatio: Math.round(usageRatio*10)/10,
    cats, totalUtils: Math.round(monthUtils*100)/100, budget: startBalance
  };
}

function getAllMonthsSummary() {
  const monthMap = {};
  dailyData.forEach(d => {
    const m = d.d.slice(0, 7);
    if (!monthMap[m]) monthMap[m] = { label: m, f: 0, t: 0, u: 0, o: 0, days: 0, total: 0 };
    monthMap[m].f += d.fs;
    monthMap[m].t += d.t;
    monthMap[m].o += d.o;
    monthMap[m].total += d.total;
    if (d.total > 0) monthMap[m].days++;
  });
  WEEK_KEYS.forEach((k, i) => {
    const m = getWeekMonth(i);
    if (monthMap[m]) {
      const uVal = parseFloat(weeklyUtils[k]) || 0;
      monthMap[m].u += uVal;
      monthMap[m].total += uVal;
    }
  });
  return Object.values(monthMap).map(m => ({
    ...m, f: Math.round(m.f*100)/100, t: Math.round(m.t*100)/100,
    u: Math.round(m.u*100)/100, o: Math.round(m.o*100)/100,
    total: Math.round(m.total*100)/100,
    display: getMonthDisplay(m.label),
    dailyAvg: m.days > 0 ? Math.round(m.total/m.days*100)/100 : 0,
    budget: getMonthStartBalance(m.label)
  })).sort((a,b) => a.label.localeCompare(b.label));
}

function getWeekLabel(dateStr) {
  const dt = new Date(dateStr);
  const day = dt.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  const start = new Date(dt); start.setDate(dt.getDate() + diff);
  const end = new Date(start); end.setDate(start.getDate() + 6);
  const fmt = d => String(d.getMonth()+1)+'/'+String(d.getDate()).padStart(2,'0');
  return fmt(start) + '-' + fmt(end);
}

// ========== RENDER ==========
function switchMonth(monthKey) {
  currentMonth = monthKey;
  render();
}

function renderMonthSelector() {
  const months = getAvailableMonths();
  document.getElementById('monthSelector').innerHTML = months.length > 1
    ? months.map(m => `<button class="month-btn ${m === currentMonth ? 'active' : ''}" onclick="switchMonth('${m}')">${getMonthDisplay(m)}</button>`).join('')
    : '';
}

function render() {
  recalc();
  renderMonthSelector();

  // Update balance input for current month
  document.getElementById('initBalanceInput').value = (monthlyBudgets[currentMonth] || 0).toFixed(2);
  document.getElementById('balanceLabel').textContent = getMonthDisplay(currentMonth) + '初始余额';

  const s = getMonthSummary(currentMonth);

  // Cards
  document.getElementById('cardsContainer').innerHTML = `
    <div class="card red"><div class="label">${getMonthDisplay(currentMonth)}总支出</div><div class="value">¥${s.totalExpense.toFixed(2)}</div><div class="sub">含水电 ¥${s.totalUtils.toFixed(2)}</div></div>
    <div class="card orange"><div class="label">日均支出</div><div class="value">¥${s.dailyAvg.toFixed(2)}</div><div class="sub">含水电</div></div>
    <div class="card purple"><div class="label">单日最高</div><div class="value">¥${s.maxDaily.toFixed(2)}</div><div class="sub">最高单日消费</div></div>
    <div class="card blue"><div class="label">月初余额</div><div class="value">¥${s.budget.toFixed(2)}</div><div class="sub">含上月结余</div></div>
    <div class="card green"><div class="label">当前余额</div><div class="value">¥${s.curBalance.toFixed(2)}</div><div class="sub">剩余可支配</div></div>
    <div class="card teal"><div class="label">使用比率</div><div class="value">${s.usageRatio}%</div><div class="sub">已用 / 月初</div></div>
  `;

  // Chart month labels
  document.getElementById('pieChartMonth').textContent = getMonthDisplay(currentMonth);
  document.getElementById('barChartMonth').textContent = getMonthDisplay(currentMonth);
  document.getElementById('lineChartMonth').textContent = getMonthDisplay(currentMonth);

  // Weekly utils (filtered by current month)
  const visibleWeekKeys = WEEK_KEYS.filter((k, i) => getWeekMonth(i) === currentMonth);
  const wuTotal = visibleWeekKeys.reduce((s, k) => s + (parseFloat(weeklyUtils[k])||0), 0);
  if (visibleWeekKeys.length > 0) {
    document.getElementById('weeklyUtilsContainer').innerHTML =
      visibleWeekKeys.map(k => {
        const i = WEEK_KEYS.indexOf(k);
        return `<div class="wu-item"><div class="wu-label">${WEEK_LABELS[i]}</div><input class="wu-input" type="number" step="0.01" value="${weeklyUtils[k]||0}" data-key="${k}" onchange="updateWeeklyUtil('${k}', this.value)"></div>`;
      }).join('') +
      `<div class="wu-item" style="background:#e6fffb;"><div class="wu-label">水电合计</div><div class="wu-total">¥${wuTotal.toFixed(2)}</div></div>`;
  } else {
    document.getElementById('weeklyUtilsContainer').innerHTML = '<p style="font-size:11px;color:#999;">本月无水电支出</p>';
  }

  // Daily table (filtered by current month)
  const monthIndices = dailyData.reduce((acc, d, i) => {
    if (d.d.startsWith(currentMonth)) acc.push(i);
    return acc;
  }, []);
  const monthData = monthIndices.map(i => dailyData[i]);

  document.getElementById('dailyBody').innerHTML = monthIndices.length > 0
    ? monthIndices.map(origIdx => {
        const d = dailyData[origIdx];
        const h = d.total > 0;
        return `<tr>
          <td><button class="del-btn" onclick="deleteRow(${origIdx})">×</button></td>
          <td><input class="editable" type="text" value="${d.d}" onchange="editDate(${origIdx}, this.value)"></td>
          <td>${d.w?'周'+d.w:''}</td>
          <td><input class="editable" type="number" step="0.01" value="${d.fw||''}" onchange="editCell(${origIdx},'fw',this.value)"></td>
          <td><input class="editable" type="number" step="0.01" value="${d.fh||''}" onchange="editCell(${origIdx},'fh',this.value)"></td>
          <td class="calc">${d.fs?'¥'+d.fs.toFixed(2):'-'}</td>
          <td><input class="editable" type="number" step="0.01" value="${d.t||''}" onchange="editCell(${origIdx},'t',this.value)"></td>
          <td><input class="editable" type="number" step="0.01" value="${d.o||''}" onchange="editCell(${origIdx},'o',this.value)"></td>
          <td class="calc"><strong>${h?'¥'+d.total.toFixed(2):'-'}</strong></td>
          <td class="calc">¥${d.rem.toFixed(2)}</td>
          <td><input class="editable editable-note" type="text" value="${d.note||''}" onchange="editCell(${origIdx},'note',this.value)" placeholder="备注"></td>
        </tr>`;
      }).join('')
    : '<tr><td colspan="11" style="color:#999;padding:12px;">暂无数据</td></tr>';

  // Monthly table (ALL months)
  const allMonths = getAllMonthsSummary();
  document.getElementById('monthlyBody').innerHTML = allMonths.length
    ? allMonths.map(m => `<tr><td><strong>${m.display}</strong></td><td>${m.days}天</td><td>¥${m.budget.toFixed(2)}</td><td>¥${m.f.toFixed(2)}</td><td>¥${m.t.toFixed(2)}</td><td>${m.u?'¥'+m.u.toFixed(2):'-'}</td><td>¥${m.o.toFixed(2)}</td><td><strong>¥${m.total.toFixed(2)}</strong></td><td>¥${m.dailyAvg.toFixed(2)}</td></tr>`).join('')
    : '<tr><td colspan="9" style="color:#999;padding:12px;">暂无数据</td></tr>';

  // Weekly table (all weeks)
  const weekMap = {};
  dailyData.forEach(d => {
    const wl = getWeekLabel(d.d);
    if (!weekMap[wl]) weekMap[wl] = { label: wl, f: 0, t: 0, u: 0, o: 0, total: 0 };
    weekMap[wl].f += d.fs;
    weekMap[wl].t += d.t;
    weekMap[wl].o += d.o;
    weekMap[wl].total += d.total;
  });
  WEEK_KEYS.forEach((k, i) => {
    const label = getWeekLabel(WEEK_RANGES[i][0]);
    if (weekMap[label]) {
      weekMap[label].u = (parseFloat(weeklyUtils[k]) || 0);
      weekMap[label].total += weekMap[label].u;
    }
  });
  const weeks = Object.values(weekMap).map(w => ({
    ...w, f: Math.round(w.f*100)/100, t: Math.round(w.t*100)/100,
    u: Math.round(w.u*100)/100, o: Math.round(w.o*100)/100, total: Math.round(w.total*100)/100
  }));
  weeks.sort((a,b) => a.label.localeCompare(b.label));
  document.getElementById('weeklyBody').innerHTML = weeks.length
    ? weeks.map(w => `<tr><td><strong>${w.label}</strong></td><td>¥${w.f.toFixed(2)}</td><td>¥${w.t.toFixed(2)}</td><td>${w.u?'¥'+w.u.toFixed(2):'-'}</td><td>¥${w.o.toFixed(2)}</td><td><strong>¥${w.total.toFixed(2)}</strong></td></tr>`).join('')
    : '<tr><td colspan="6" style="color:#999;padding:12px;">暂无数据</td></tr>';

  document.getElementById('daysCount').textContent = s.recordDays + ' 天';
  if (monthData.length > 0) {
    document.getElementById('headerDateRange').textContent = monthData[0].d + ' — ' + monthData[monthData.length-1].d;
  } else {
    document.getElementById('headerDateRange').textContent = getMonthDisplay(currentMonth) + ' (暂无数据)';
  }

  renderCharts(s, monthData);
  saveData();
}

// ========== CHARTS ==========
function renderCharts(s, monthData) {
  Object.values(chartInstances).forEach(c => c && c.destroy());
  chartInstances = {};
  chartInstances.pie = new Chart(document.getElementById('pieChart'), {
    type: 'doughnut',
    data: { labels: s.cats.map(c=>c.n), datasets: [{ data: s.cats.map(c=>c.amt), backgroundColor: s.cats.map(c=>c.color), borderWidth: 2 }] },
    options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { position: 'bottom', labels: { padding: 12, usePointStyle: true, font: { size: 10 } } }, tooltip: { callbacks: { label: ctx => ctx.label + ': ¥' + ctx.parsed.toFixed(2) + ' (' + s.cats[ctx.dataIndex].pct + '%)' } } } }
  });
  const wd = monthData.filter(d => d.total > 0 || d.fs > 0);
  chartInstances.bar = new Chart(document.getElementById('barChart'), {
    type: 'bar',
    data: { labels: wd.map(d=>d.d.slice(5)), datasets: [
      { label: '饮食', data: wd.map(d=>d.fs), backgroundColor: CAT_COLORS.food, borderRadius: 2 },
      { label: '交通', data: wd.map(d=>d.t), backgroundColor: CAT_COLORS.transport, borderRadius: 2 },
      { label: '其他', data: wd.map(d=>d.o), backgroundColor: CAT_COLORS.other, borderRadius: 2 }
    ]},
    options: { responsive: true, maintainAspectRatio: true, scales: { x: { stacked: true, grid: { display: false }, ticks: { font: { size: 9 } } }, y: { stacked: true, beginAtZero: true, grid: { color: '#f0f0f0' }, ticks: { font: { size: 9 } } } }, plugins: { legend: { position: 'bottom', labels: { usePointStyle: true, padding: 8, font: { size: 10 } } }, tooltip: { callbacks: { footer: items => '合计: ¥' + wd[items[0].dataIndex].total.toFixed(2) } } } }
  });
  chartInstances.line = new Chart(document.getElementById('lineChart'), {
    type: 'line',
    data: { labels: monthData.map(d=>d.d.slice(5)), datasets: [{ label: '余额', data: monthData.map(d=>d.rem), borderColor: '#1890ff', backgroundColor: 'rgba(24,144,255,0.08)', fill: true, tension: 0.3, pointRadius: 2, pointBackgroundColor: '#1890ff', borderWidth: 2 }] },
    options: { responsive: true, maintainAspectRatio: true, scales: { x: { grid: { display: false }, ticks: { maxTicksLimit: 10, font: { size: 9 } } }, y: { beginAtZero: false, grid: { color: '#f0f0f0' }, ticks: { font: { size: 9 } } } }, plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => '余额: ¥' + ctx.parsed.y.toFixed(2) } } } }
  });
}

// ========== EDITING ==========
function editCell(i, field, val) {
  if (field === 'note') { dailyData[i][field] = val; }
  else { const n = parseFloat(val); dailyData[i][field] = isNaN(n) ? 0 : n; }
  render();
}
function editDate(i, val) {
  const dt = new Date(val);
  if (isNaN(dt.getTime())) { toast('日期格式无效'); return; }
  dailyData[i].d = dt.toISOString().slice(0,10);
  dailyData[i].w = WEEK_NAMES[dt.getDay() === 0 ? 6 : dt.getDay() - 1];
  render();
}
function deleteRow(i) {
  if (dailyData.length <= 1) { toast('至少保留一行'); return; }
  if (!confirm('确定删除 ' + dailyData[i].d + ' 这条记录？')) return;
  dailyData.splice(i, 1);
  render();
}
function toLocalDate(year, month, day) {
  return year + '-' + String(month).padStart(2, '0') + '-' + String(day).padStart(2, '0');
}

function addRow() {
  const monthRows = dailyData.filter(d => d.d.startsWith(currentMonth));
  let ds;
  if (monthRows.length > 0) {
    const last = monthRows[monthRows.length - 1].d;
    const p = last.split('-').map(Number);
    const d = new Date(p[0], p[1] - 1, p[2]);
    d.setDate(d.getDate() + 1);
    ds = toLocalDate(d.getFullYear(), d.getMonth() + 1, d.getDate());
  } else {
    ds = currentMonth + '-01';
  }
  const p = ds.split('-').map(Number);
  const dt = new Date(p[0], p[1] - 1, p[2]);
  const w = WEEK_NAMES[dt.getDay() === 0 ? 6 : dt.getDay() - 1];
  dailyData.push({ d: ds, w, fw:0, fh:0, fs:0, t:0, o:0, total:0, rem:0, note:'' });
  render();
}
function updateWeeklyUtil(key, val) {
  weeklyUtils[key] = isNaN(parseFloat(val)) ? 0 : parseFloat(val);
  render();
}
function updateFromBalanceChange() {
  const val = parseFloat(document.getElementById('initBalanceInput').value);
  if (isNaN(val) || val <= 0) { toast('请输入有效金额'); return; }
  monthlyBudgets[currentMonth] = val;
  render();
}
function resetData() {
  if (!confirm('确定重置为原始数据？此操作会同步到所有设备。')) return;
  dailyData = ORIGINAL_DATA.map(d => ({...d}));
  weeklyUtils = { w1: 21, w2: 45, w3: 0, w4: 0 };
  monthlyBudgets = { '2026-06': 2370, '2026-07': 2370 };
  currentMonth = '2026-06';
  render();
}
function exportCSV() {
  const BOM = '\uFEFF';
  let csv = BOM + '日期,星期,饮食-W,饮食-H,饮食小计,交通,其他,日合计,余额,备注\n';
  dailyData.forEach(d => { csv += `${d.d},周${d.w},${d.fw},${d.fh},${d.fs},${d.t},${d.o},${d.total},${d.rem},"${d.note}"\n`; });
  csv += '\n水电(周结算)\n';
  WEEK_KEYS.forEach((k, i) => { csv += `${WEEK_LABELS[i]},${weeklyUtils[k]||0}\n`; });
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '财务支出明细.csv'; a.click();
  URL.revokeObjectURL(a.href);
}
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

// ========== INIT ==========
startSync();
</script>
